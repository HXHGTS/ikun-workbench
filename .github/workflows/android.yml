name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      - name: Restore keystore (if secret provided)
        env:
          KS_B64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/ikun-release.keystore
          fi

      - name: Build APKs (universal + ABI splits)
        working-directory: android
        run: |
          APP_VER="1.0.$((GITHUB_RUN_NUMBER-1))"
          ./gradlew assembleRelease --no-daemon -PAPP_VER="$APP_VER" -PVERSION_CODE="$GITHUB_RUN_NUMBER"
        env:
          KS_PATH: /tmp/ikun-release.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ikun

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'windows-tauri'

      - name: Set version
        run: |
          $ver = "1.0.$($env:GITHUB_RUN_NUMBER - 1)"
          (Get-Content windows-tauri/Cargo.toml) -replace '^version = .*', "version = `"$ver`"" | Set-Content windows-tauri/Cargo.toml
          (Get-Content windows-tauri/tauri.conf.json) -replace '"version": "1.0.0"', "`"version`": `"$ver`"" | Set-Content windows-tauri/tauri.conf.json

      - name: Build x64
        working-directory: windows-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build x86
        working-directory: windows-tauri
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Build arm64
        working-directory: windows-tauri
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Collect executables
        run: |
          New-Item -ItemType Directory -Force -Path pub-win | Out-Null
          Copy-Item windows-tauri/target/x86_64-pc-windows-msvc/release/ikun.exe pub-win/ikun-windows-x64.exe
          Copy-Item windows-tauri/target/i686-pc-windows-msvc/release/ikun.exe pub-win/ikun-windows-x86.exe
          Copy-Item windows-tauri/target/aarch64-pc-windows-msvc/release/ikun.exe pub-win/ikun-windows-arm64.exe
          Get-ChildItem pub-win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: pub-win/*.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel

      - name: Organize & rename
        run: |
          mkdir pub
          find rel -name "*.apk" -exec mv {} pub/ \;
          cd pub
          for f in app-*.apk; do
            mv "$f" "ikun-android-$(basename "$f" | sed 's/app-//;s/-release//')"
          done
          find ../rel -name "ikun-windows-*.exe" -exec mv {} . \;
          ls -la

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.$(expr ${GITHUB_RUN_NUMBER} - 1)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" pub/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" pub/* --repo "$GITHUB_REPOSITORY" \
              --title "ikun新媒体制作中心 $TAG" \
              --notes "自动构建 · 正式签名 · Android（universal/arm64/armv7/x86_64/x86）+ Windows（x64/x86/arm64 · Tauri/Rust 原生壳）"
          fi
