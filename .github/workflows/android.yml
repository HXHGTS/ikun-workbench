name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      - name: Restore keystore (if secret provided)
        env:
          KS_B64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/ikun-release.keystore
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KS_PATH: /tmp/ikun-release.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ikun

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikun-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.$(expr ${GITHUB_RUN_NUMBER} - 1)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk \
              --title "ikun新媒体制作中心 $TAG" \
              --notes "自动构建 · 正式签名 · commit ${GITHUB_SHA::7}"
          fi
