name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,x86_64-unknown-linux-gnu'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'windows-tauri'

      - name: Install deps
        run: npm ci

      - name: Install tauri-cli
        run: |
          curl -sL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.9.4/cargo-tauri-x86_64-unknown-linux-gnu.tgz" -o cli.tgz
          tar xzf cli.tgz
          chmod +x cargo-tauri
          sudo mv cargo-tauri /usr/local/bin/
          cargo-tauri --version

      - name: Android NDK
        run: |
          NDK=$(ls $ANDROID_HOME/ndk | sort -V | tail -1)
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> $GITHUB_ENV
          echo "NDK $NDK"

      - name: Set version
        run: |
          VER="1.0.$((GITHUB_RUN_NUMBER-1))"
          sed -i "s/\"version\": \"1.0.0\"/\"version\": \"$VER\"/" windows-tauri/tauri.conf.json

      - name: Android init
        working-directory: windows-tauri
        run: cargo tauri android init

      - name: Debug gen structure
        working-directory: windows-tauri
        run: find gen -maxdepth 2 2>/dev/null | head -20

      - name: Patch gen/android
        working-directory: windows-tauri
        run: python3 ../scripts/patch_android.py gen/android "1.0.$((GITHUB_RUN_NUMBER-1))"

      - name: Build APKs
        working-directory: windows-tauri
        run: cargo tauri android build --apk

      - name: Sign & collect APKs
        env:
          KS_B64: ${{ secrets.KS_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          mkdir -p pub
          find gen/android/ikun/build/outputs/apk -name "*.apk" -exec cp {} pub/ \;
          cd pub
          for f in *-unsigned.apk; do
            [ -e "$f" ] && mv "$f" "${f%-unsigned.apk}.apk" || true
          done
          BTDIR=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/ikun-release.keystore
            for f in *.apk; do
              $BTDIR/zipalign -p 4 "$f" /tmp/al.apk
              $BTDIR/apksigner sign --ks /tmp/ikun-release.keystore --ks-pass "pass:$KS_PASS" --ks-key-alias ikun --out /tmp/signed.apk /tmp/al.apk
              mv /tmp/signed.apk "$f"
            done
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: pub/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'windows-tauri'

      - name: Set version
        run: |
          $ver = "1.0.$($env:GITHUB_RUN_NUMBER - 1)"
          (Get-Content windows-tauri/Cargo.toml) -replace '^version = .*', "version = `"$ver`"" | Set-Content windows-tauri/Cargo.toml
          (Get-Content windows-tauri/tauri.conf.json) -replace '"version": "1.0.0"', "`"version`": `"$ver`"" | Set-Content windows-tauri/tauri.conf.json

      - name: Build x64
        working-directory: windows-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build x86
        working-directory: windows-tauri
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Build arm64
        working-directory: windows-tauri
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Collect executables
        run: |
          New-Item -ItemType Directory -Force -Path pub-win | Out-Null
          Copy-Item windows-tauri/target/x86_64-pc-windows-msvc/release/ikun.exe pub-win/ikun-windows-x64.exe
          Copy-Item windows-tauri/target/i686-pc-windows-msvc/release/ikun.exe pub-win/ikun-windows-x86.exe
          Copy-Item windows-tauri/target/aarch64-pc-windows-msvc/release/ikun.exe pub-win/ikun-windows-arm64.exe
          Get-ChildItem pub-win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: pub-win/*.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel

      - name: Organize & rename
        run: |
          mkdir pub
          find rel -name "*.apk" -exec mv {} pub/ \;
          cd pub
          for f in app-*.apk; do
            mv "$f" "ikun-android-$(basename "$f" | sed 's/app-//;s/-release//')"
          done
          find ../rel -name "ikun-windows-*.exe" -exec mv {} . \;
          ls -la

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.$(expr ${GITHUB_RUN_NUMBER} - 1)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" pub/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" pub/* --repo "$GITHUB_REPOSITORY" \
              --title "ikun新媒体制作中心 $TAG" \
              --notes "自动构建 · 正式签名 · Android（universal/arm64/armv7/x86_64/x86）+ Windows（x64/x86/arm64 · Tauri/Rust 原生壳）"
          fi
